# CQA served by the server IP over plain HTTP, without a sign-in gate.
# Install: sudo cp deploy/nginx-cqa-ip.conf /etc/nginx/sites-available/cqa-ip
#          sudo ln -s /etc/nginx/sites-available/cqa-ip /etc/nginx/sites-enabled/cqa-ip
#          sudo nginx -t && sudo systemctl reload nginx
# The app itself listens on 127.0.0.1:8090 (docker compose, APP_PORT=8090).
# Any other host name on port 80 (e.g. the former assistant.miraitech.health) gets nothing.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name 34.158.228.29;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No sign-in gate here: drop any user header a client might send.
        proxy_set_header X-Auth-Email "";
        proxy_read_timeout 180s;
    }
}
